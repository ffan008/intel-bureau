# 情报局 v2 · 风险类别补充词表（用户可改，只追加，不覆盖 taxonomy.yaml）
#
# v2 新增的风险类别「违法高危」「隐私」「平台规则」「版权风险」由程序合并到 taxonomy.yaml 的 risk_flags 后面，
# 默认词表写在代码里（bureau/core/taxonomy.py 的 V2_RISK_LEXICON / V2_PRIVACY_CUES）。
# 这里写的词会追加到默认词表后面。taxonomy.yaml 仍由 v1 读取，不要把新类别写进去。
#
# 处理方式见 docs/V2_KNOWLEDGE.md §2：
# - 违法高危：照常记录和总结，只进「风险与踩坑」板块，不成为专题，不做联网扩展，不写分步教程
# - 隐私：内容主要是某个普通人的手机号、住址、身份证号等，整条剔除并计数
# - 其它类别：照常提取、可以进头条和专题，只标注风险并附免责声明

risk_flags: []          # 需要额外的类别时写在这里，例如 [数据安全]

risk_lexicon:
  违法高危: []
  平台规则: []
  版权风险: []

# 与手机号、身份证等脱敏占位符同时出现时，判定为"内容主要是某个人的隐私"
privacy_cues: []
